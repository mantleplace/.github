name: Bug
description: Report something that is broken
type: Bug
labels:
  - needs-triage
body:
  - type: textarea
    id: what
    attributes:
      label: What
      description: "One sentence: what is broken, and what should happen instead."
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: One sentence on why it matters now.
    validations:
      required: true
